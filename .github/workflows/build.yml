name: build-postgres-pgbackrest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4          # pin to commit SHA

      - name: Parse version and image name
        id: ver
        run: |
          v=$(sed -n 's/^FROM postgres:\([0-9][0-9.]*\)@sha256:.*/\1/p' Dockerfile)
          test -n "$v" || { echo "FROM must be postgres:<version>@sha256:<digest>"; exit 1; }
          echo "pg=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postgres-pgbackrest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3   # pin to commit SHA

      - name: Build (local only)
        uses: docker/build-push-action@v6      # pin to commit SHA
        with:
          context: .
          load: true
          push: false
          tags: ci-test:latest

      - name: Smoke test
        env:
          PG: ${{ steps.ver.outputs.pg }}
        run: |
          set -euo pipefail
          docker run --rm ci-test:latest postgres --version | grep -F "$PG"
          docker run --rm --user postgres ci-test:latest pgbackrest version
          docker run -d --name pgtest -e POSTGRES_PASSWORD=ci-only ci-test:latest
          ok=0
          for i in $(seq 1 30); do
            if docker exec pgtest pg_isready -U postgres -q; then ok=1; break; fi
            sleep 2
          done
          docker logs pgtest | tail -n 20
          docker rm -f pgtest
          [ "$ok" = 1 ]



      - uses: docker/login-action@v3           # pin to commit SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5        # pin to commit SHA
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.pg }}
            type=raw,value=${{ steps.ver.outputs.pg }}-{{date 'YYYYMMDD'}}-{{sha}}

      - name: Push the tested image
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          MAIN_TAG: ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.pg }}
        run: |
          set -euo pipefail
          for t in $TAGS; do
            docker tag ci-test:latest "$t"
            docker push "$t"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$MAIN_TAG" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v3   # pin to commit SHA
        with:
          subject-name: ${{ steps.ver.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Print digest for deployment
        run: |
          echo "Deploy: ${{ steps.ver.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
